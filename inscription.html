<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Obsidian Parfums</title>
    <meta name="description" content="Créez votre compte Obsidian Parfums et accédez à notre univers olfactif d'exception.">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a href="accueil.html">
            <img src="logo.png" alt="Retour à l'accueil - Obsidian Parfums" class="logo-site">
        </a>
        <div id="nav"></div>
    </header>

    <main>
        <div class="cadre-connexion">
            <form>
                <p class="slogan">Rejoindre la maison</p>
                <h2>Créer un compte Obsidian</h2>
                <hr class="ligne-separation">
                <p>
                    <label for="email">Email :</label>
                    <input type="email" id="email" name="user_email" placeholder="votre@email.com"required>
                </p>

                <p>
                    <label for="password">Mot de passe :</label>
                    <input type="password" id="password" name="user_password" placeholder="••••••••"required>
                </p>

                <p>
                    <label for="confirm-password">Confirmer le mot de passe :</label>
                    <input type="password" id="confirm-password" name="confirm_password" placeholder="••••••••"required>
                </p>

                <p>
                    <button type="submit">S'inscrire</button>
                </p>
                <p style="text-align:center; margin-top:24px; font-size:13px; color:var(--text-dim);">
                Déjà un compte ?
                <a href="connexion.html" style="color:var(--primary-light); text-decoration:none; font-weight:600;">Se connecter →</a>
            </p>
            </form>
        </div>
    </main>

    <script src="nav.js"></script>
    <script>chargerNav('inscription');</script>
    <script src="nav.js"></script>
</body>
</html>
