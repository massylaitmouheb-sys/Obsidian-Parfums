<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Obsidian Parfums</title>
    <meta name="description" content="Connectez-vous à votre compte Obsidian Parfums .">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="accueil.html">
            <img src="logo.png" alt="Retour à l'accueil - Obsidian Parfums" class="logo-site">
        </a>
        <div id="nav"></div>
    </header>

    <main>
        <div class="cadre-connexion">
            <form>
                <p class="slogan">Espace personnel</p>
                <h2>Se connecter à Obsidian</h2>
                <hr class="ligne-separation">
                <p>
                    <label for="email">Adresse email</label>
                    <input type="email" id="email" name="user_email" placeholder="votre@email.com" required>
                </p>
            
                <p>
                    <label for="password">Mot de passe :</label>
                    <input type="password" id="password" name="user_password" placeholder="••••••••" required>
                </p>

                <p>
                    <button type="submit">Se connecter</button>
                </p>
                 <p style="text-align:center; margin-top:24px; font-size:13px; color:var(--text-dim);">
                Pas encore de compte ?
                <a href="inscription.html" style="color:var(--primary-light); text-decoration:none; font-weight:600;">Créer un compte →</a>
            </p>
            </form>
        </div>
    </main>

    <script src="nav.js"></script>
    <script>chargerNav('connexion');</script>
    <script src="nav.js"></script>
    <script>
        chargerNav('connexion');
        function connecter() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            const msg = document.getElementById('msg-erreur');
            if (!email || !pass) {
                msg.style.display = 'block';
                msg.textContent = 'Veuillez remplir tous les champs.';
            } else {
                msg.style.display = 'none';
                alert('Connexion réussie ! (démo)');
            }
        }
    </script>
</body>
</html>
