<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil - Obsidian Parfums</title>
    <meta name="description" content="Obsidian Parfums — Une collection de fragrances de luxe pour homme.">
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <header>
        <a href="accueil.html">
            <img src="logo.png" alt="Retour à l'accueil — Obsidian Parfums" class="logo-site">
        </a>
        <div id="nav"></div>
    </header>

    <main>
        <div class="cadre-accueil" style="text-align:center;">
            <p class="slogan">Maison de parfums · Collection Homme</p>
            <h1>Obsidian<br>Parfums</h1>
            <hr class="ligne-separation">
            <p style="font-size:15px; color:var(--text-muted); line-height:1.9; margin-bottom:32px;">
                Bienvenue dans un univers olfactif d'exception. Nos fragrances capturent l'essence de l'élégance moderne — audacieuses, profondes, inoubliables.
            </p>
            <div class="boutons-action" style="display:flex; gap:16px; justify-content:center; flex-wrap:wrap;">
                <a href="produits.html" class="btn-principal">Découvrir la collection</a>
                <a href="blog.html" class="btn-principal" style="background: transparent; border: 1px solid var(--border); color: var(--primary-light); box-shadow: none;">Notre univers</a>
            </div>

            <div style="display:flex; justify-content:center; gap:40px; margin-top:44px; padding-top:32px; border-top:1px solid var(--border);">
                <div style="text-align:center;">
                    <div style="font-size:24px; font-weight:700; background:linear-gradient(to right,var(--primary-light),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;">15+</div>
                    <div style="font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--text-dim); margin-top:4px;">Fragrances</div>
                </div>
                <div style="text-align:center;">
                    <div style="font-size:24px; font-weight:700; background:linear-gradient(to right,var(--primary-light),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;">100%</div>
                    <div style="font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--text-dim); margin-top:4px;">Artisanal</div>
                </div>
                <div style="text-align:center;">
                    <div style="font-size:24px; font-weight:700; background:linear-gradient(to right,var(--primary-light),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;">DZ</div>
                    <div style="font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--text-dim); margin-top:4px;">Livraison</div>
                </div>
            </div>
        </div>
    </main>

    <script src="nav.js"></script>
    <script>chargerNav('accueil');</script>
</body>
</html>
